# The corpus carries no version stamp, so its history is a file rather than an
# integer in a filename (GUIDE-CONFORMANCE §5.1). Declaring it is what publishes
# it — a file that was never public cannot show up as a deletion, so the
# public-regress gate cannot vouch for it.
[[doc]]
